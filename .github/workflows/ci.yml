name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities: none in production dependencies, and none of
      # high severity or above in the build and test tools.
      - run: pnpm audit --prod
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # End to end against the production build just made.
      - run: pnpm --filter @app/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @app/e2e e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t threshold-monitor .
      # docker-compose.yml as users run it: the relay must report healthy,
      # and the sensor container must connect to it.
      - run: echo "SENSOR_TOKEN=$(openssl rand -hex 24)" > .env
      # --wait refuses a container without a health check (the sensor), so
      # wait for the relay only; the next step checks the sensor.
      - run: docker compose up -d --no-build --wait --wait-timeout 60 relay
      - run: docker compose up -d --no-build sensor
      - run: |
          for i in $(seq 1 30); do
            docker compose logs relay | grep -q '"sensor online"' && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      # End to end against the production build just made.
      - run: pnpm --filter @app/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @app/e2e e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t threshold-monitor .
      # The image must start and report healthy, not only build.
      - run: |
          docker run -d --name relay -p 8080:8080 threshold-monitor
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' relay)
            [ "$status" = healthy ] && exit 0
            sleep 1
          done
          docker logs relay
          exit 1

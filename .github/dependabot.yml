# Weekly update PRs. CI checks each one like any other change.
version: 2
updates:
  - package-ecosystem: npm # reads pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    # Like the pnpm minimum release age: no version younger than a week.
    cooldown:
      default-days: 7
    groups:
      # One PR for all minor and patch updates; each major update alone.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node version of .nvmrc (24 LTS), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node 24 is the LTS version. A new major version is a decision, with
      # .nvmrc, engines and CI, not a weekly update. Node 25 also has no
      # corepack, which the Dockerfile needs.
      - dependency-name: node
        update-types: [version-update:semver-major]

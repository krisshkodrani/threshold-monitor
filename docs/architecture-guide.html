__arrow`,"aria-hidden":`true`,children:`↗`})]},r))})}var y=o(),b={"Chapter 1 · The mechanism":`Kapitel 1 · Der Ablauf`,"Follow one alert through the code.":`Einem Alarm durch den Code folgen.`,"Repository excerpts":`Auszüge aus dem Repository`,"Start with what happens during a crossing. Read detection first, then delivery, then the browser update. Each excerpt explains one responsibility and links to its recovery rules and React behavior.":`Beginne mit einer Grenzwertüberschreitung. Lies zuerst die Erkennung, dann die Zustellung und schließlich die Aktualisierung im Browser. Jeder Codeauszug erklärt eine Aufgabe und verlinkt die zugehörigen Wiederherstellungsregeln und das React-Verhalten.`,"The path to explain":`So lässt sich der Ablauf erklären`,"Sensor decides → outbox retries → relay stores → browsers display.":`Sensor entscheidet → Outbox wiederholt → Relay speichert → Browser zeigen an.`,"The sensor creates the alert; the relay owns the durable record. Browser state is a view of that record.":`Der Sensor erzeugt den Alarm; das Relay verwaltet den dauerhaft gespeicherten Datensatz. Der Browser stellt eine Ansicht dieses Datensatzes dar.`,"Use the three file groups below. The code excerpts show the mechanism;":`Nutze die drei Dateigruppen unten. Die Codeauszüge zeigen den Ablauf;`,"State & Resilience":`Zustand & Ausfallsicherheit`,"explains the guarantees, and":`erklärt die Garantien, und`,"React Architecture":`React-Architektur`,"explains the update on screen.":`erklärt die Aktualisierung auf dem Bildschirm.`,"1 · Detect the crossing":`1 · Grenzwertüberschreitung erkennen`,"2 · Deliver and store":`2 · Zustellen und speichern`,"3 · Update the browsers":`3 · Browser aktualisieren`,"Redux store":`Redux-Store`,"The coordinator":`Die Koordination`,"One reading, one decision path":`Ein Messwert, ein Entscheidungsweg`,"The agent subscribes to readings and shared settings. It sends each reading, advances the detector, and constructs an alert only when a crossing occurs.":`Der Agent empfängt Messwerte und gemeinsame Einstellungen. Er sendet jeden Messwert, aktualisiert den Detektor und erzeugt nur bei einer Grenzwertüberschreitung einen Alarm.`,"Copy excerpt":`Codeauszug kopieren`,"Why this boundary?":`Warum diese Aufteilung?`,"A source and a transport are injected. Tests can supply readings and inspect sent alerts without real clocks or sockets.":`Datenquelle und Transport werden als Abhängigkeiten übergeben. Tests können Messwerte vorgeben und gesendete Alarme prüfen, ohne echte Uhren oder Sockets zu verwenden.`,"Verbatim repository excerpt · Some surrounding code omitted ·":`Unveränderter Repository-Auszug · Umgebender Code teilweise ausgelassen ·`,"Open source file ↗":`Quelldatei öffnen ↗`,"The point to explain":`Der entscheidende Punkt`,"The agent coordinates one reading; the detector makes the crossing decision.":`Der Agent koordiniert die Verarbeitung eines Messwerts; der Detektor entscheidet, ob eine Grenzwertüberschreitung vorliegt.`,"Where this state lives & recovers →":`Wo dieser Zustand liegt und wie er wiederhergestellt wird →`,"How React uses it →":`Wie React ihn verwendet →`,"The detector":`Der Detektor`,"A small state machine":`Ein kleiner Zustandsautomat`,"The state is below, above, or not initialized. A strict comparison beyond the opposite hysteresis edge produces an event.":`Der Zustand ist unterhalb, oberhalb oder noch nicht initialisiert. Erst ein striktes Überschreiten der gegenüberliegenden Hysteresegrenze erzeugt ein Ereignis.`,"Watch the boundary":`Auf die Grenze achten`,"With T = 25 and h = 0.6, a below state changes only above 25.3. The first reading establishes state and never alerts.":`Bei T = 25 und h = 0,6 wechselt ein Zustand unterhalb erst bei einem Wert über 25,3. Der erste Messwert legt den Zustand fest und löst nie einen Alarm aus.`,"The detector remembers a side. Crossing strictly beyond the opposite edge creates an event; the first reading only initializes it.":`Der Detektor merkt sich eine Seite. Ein striktes Überschreiten der gegenüberliegenden Grenze erzeugt ein Ereignis; der erste Messwert initialisiert lediglich den Zustand.`,"The relay rules":`Die Relay-Regeln`,"Validate, store, acknowledge, distribute":`Prüfen, speichern, bestätigen, verteilen`,"The sensor owns detection. The relay enforces sender permissions and handles the durable result of an alert.":`Der Sensor übernimmt die Erkennung. Das Relay prüft die Berechtigungen des Absenders und verarbeitet den dauerhaft zu speichernden Alarm.`,"The lost-response case":`Wenn die Antwort verloren geht`,"If accepted is lost, the sensor resends the same UUID. The existing record is returned without broadcasting another alert.":`Geht accepted verloren, sendet der Sensor dieselbe UUID erneut. Das Relay liefert den vorhandenen Datensatz zurück, ohne den Alarm erneut zu verteilen.`,"The relay validates the sender and stores the alert before confirming it. A repeated UUID confirms the existing record.":`Das Relay prüft den Absender und speichert den Alarm vor der Bestätigung. Eine wiederholte UUID bestätigt den bereits vorhandenen Datensatz.`,"The delivery queue":`Die Zustellwarteschlange`,"Queued → pending → accepted":`In Warteschlange → unbestätigt → accepted`,"Sending is not confirmation. Queued entries become pending with a deadline; acceptance removes the entry from either collection.":`Senden ist noch keine Bestätigung. Einträge wechseln von der Warteschlange in den Zustand pending mit einer Frist; eine Speicherbestätigung entfernt den Eintrag aus beiden Sammlungen.`,"Know the limit":`Die Grenze kennen`,"Capacity applies to queued entries, not all outstanding alerts. Requeueing can cause overflow. The outbox is currently memory-only.":`Die Kapazitätsgrenze gilt für wartende Einträge, nicht für alle noch unbestätigten Alarme. Erneutes Einreihen kann einen Überlauf verursachen. Die Outbox liegt derzeit nur im Arbeitsspeicher.`,"Sending starts an attempt. The outbox removes an alert once storage is confirmed; process exit and overflow can still lose it.":`Senden beginnt einen Zustellversuch. Die Outbox entfernt einen Alarm nach bestätigter Speicherung; Prozessende und Überlauf können dennoch zu Verlusten führen.`,"The React bridge":`Die Brücke zu React`,"One connection lifecycle per mount":`Ein Verbindungslebenszyklus pro Einbindung`,"An effect creates the connection and disposes it in cleanup. A ref holds the connection; state holds the visible status. Effect Events read current handlers.":`Ein Effect erstellt die Verbindung und gibt sie beim Aufräumen frei. Eine Ref hält das Verbindungsobjekt; State enthält den sichtbaren Status. Effect Events lesen die aktuellen Handler.`,"Why stable connect matters":`Warum connect stabil bleiben muss`,"The effect depends on connect. A new function identity on each render would repeatedly tear down and recreate the connection.":`Der Effect hängt von connect ab. Eine neue Funktionsidentität bei jedem Rendern würde die Verbindung immer wieder abbauen und neu erstellen.`,"The custom hook owns connection setup and cleanup; the connection object handles transport and retries.":`Der Custom Hook verwaltet Aufbau und Bereinigung der Verbindung; das Verbindungsobjekt übernimmt Transport und Wiederholungsversuche.`,"The reading hooks":`Die Messwert-Hooks`,"Subscribe to an external store":`Einen externen Store abonnieren`,"useReadings subscribes to the whole rolling window. useLatestReading subscribes to the latest sample. Both use useSyncExternalStore.":`useReadings abonniert das gesamte gleitende Fenster. useLatestReading abonniert den neuesten Messwert. Beide verwenden useSyncExternalStore.`,"Snapshot identity":`Identität des Snapshots`,"Snapshots keep their reference until the data changes. Returning a new array on every snapshot call would violate this expectation.":`Snapshots behalten ihre Referenz, bis sich die Daten ändern. Bei jedem Snapshot-Aufruf ein neues Array zurückzugeben, würde diese Erwartung verletzen.`,"A custom hook subscribes React to the readings store. Stable snapshot identity lets React recognize an actual update.":`Ein Custom Hook verbindet React mit dem Messwert-Store. Eine stabile Snapshot-Identität ermöglicht es React, tatsächliche Änderungen zu erkennen.`,"Redux Toolkit in the monitor":`Redux Toolkit im Monitor`,"From relay messages to selected state":`Von Relay-Nachrichten zum ausgewählten Zustand`,"The monitor uses Redux Toolkit for alerts, shared settings, and sensor identity. Each monitor tab has its own store; the relay and SQLite own the durable shared data. Live temperature readings use a separate rolling buffer.":`Der Monitor verwendet Redux Toolkit für Alarme, gemeinsame Einstellungen und die Sensoridentität. Jeder Monitor-Tab besitzt einen eigenen Store; das Relay und SQLite verwalten die dauerhaft gespeicherten gemeinsamen Daten. Laufende Temperaturmesswerte nutzen einen separaten Ringpuffer.`,"Three slices, one store":`Drei Slices, ein Store`,"holds the latest confirmed settings,":`enthält die zuletzt bestätigten Einstellungen,`,"holds normalized alert entities and sorted IDs, and":`enthält normalisierte Alarmeinträge und sortierte IDs, und`,"holds the connected sensor’s identity.":`enthält die Identität des verbundenen Sensors.`,"combines the reducers; typed dispatch and selector hooks connect React. The monitor’s":`kombiniert die Reducer; typisierte Dispatch- und Selector-Hooks verbinden React damit. Die Datei`,"supplies the store through React Redux’s":`des Monitors stellt den Store über React Reduxs`,"Dispatch on protocol messages":`Aktionen aus Protokollnachrichten auslösen`,"The App maps relay messages to slice actions. A welcome snapshot replaces alerts and refreshes settings and sensor identity. An ordinary reading bypasses Redux.":`Die App übersetzt Relay-Nachrichten in Slice-Aktionen. Ein welcome-Snapshot ersetzt Alarme und aktualisiert Einstellungen sowie Sensoridentität. Ein gewöhnlicher Messwert umgeht Redux.`,"Select the data each view needs":`Die benötigten Daten pro Ansicht auswählen`,"Selectors derive alert counts, the newest 50 logged alerts, and chart markers from the normalized alert collection. Live operation retains at most 200 alerts. The relay’s welcome snapshot contains at most 100.":`Selectoren leiten Alarmanzahlen, die neuesten 50 Protokolleinträge und Diagrammmarkierungen aus der normalisierten Alarmsammlung ab. Im laufenden Betrieb bleiben höchstens 200 Alarme erhalten. Der welcome-Snapshot des Relays enthält höchstens 100.`,"Where Immer fits":`Die Rolle von Immer`,"Redux Toolkit’s":`Redux Toolkits`,"uses Immer, so reducers can assign fields on a draft while producing immutable updates. In":`verwendet Immer: Reducer können Felder eines Entwurfs ändern und trotzdem unveränderliche Aktualisierungen erzeugen. In`,", acknowledgement updates preserve the first known acknowledgement; entity adapter operations keep the alert collection normalized. Memoized":`bleibt bei Aktualisierungen die erste bekannte Quittierung erhalten; Entity-Adapter-Operationen halten die Alarmsammlung normalisiert. Memoisierte`,"projections derive counts and markers without storing duplicate results.":`-Projektionen leiten Anzahlen und Markierungen ab, ohne die Ergebnisse zusätzlich zu speichern.`,"Different state tools for different screens":`Passende Zustandswerkzeuge für jede Oberfläche`,"The control room uses a local":`Der Leitstand verwendet einen lokalen`,"for alarms and acknowledgements. This guide’s simulator uses":`für Alarme und Quittierungen. Der Simulator dieses Leitfadens verwendet`,"with Immer. Redux is used by the monitor; it is not the state manager for the whole system. A monitor settings edit sends":`mit Immer. Redux wird vom Monitor verwendet; es verwaltet nicht den Zustand des gesamten Systems. Eine Einstellungsänderung im Monitor sendet`,"; its slice updates when the relay confirms the settings.":`; der Slice wird aktualisiert, wenn das Relay die Einstellungen bestätigt.`,"Explore the alerts slice →":`Den Alarm-Slice ansehen →`,"Related source:":`Weitere Quelldateien:`,"Provider setup ↗":`Provider-Einrichtung ↗`,"Settings slice ↗":`Einstellungs-Slice ↗`,"Sensor slice ↗":`Sensor-Slice ↗`,"The monitor translates protocol messages into actions. Selectors turn shared application state into view data.":`Der Monitor übersetzt Protokollnachrichten in Aktionen. Selectoren wandeln den gemeinsamen Anwendungszustand in Daten für die Ansicht um.`,"The monitor state":`Der Monitor-Zustand`,"Reconcile and derive":`Abgleichen und ableiten`,"Redux holds normalized alert records, sorts by sensor event time, and derives counts and chart markers. Live readings take a separate path.":`Redux hält normalisierte Alarmdatensätze, sortiert sie nach der Ereigniszeit des Sensors und leitet Anzahlen sowie Diagrammmarkierungen ab. Laufende Messwerte nehmen einen separaten Weg.`,"Reconnect behavior":`Verhalten beim Wiederverbinden`,"welcomed replaces the collection with at most 100 records. Live operation retains at most 200 and the log shows the newest 50.":`welcomed ersetzt die Sammlung durch höchstens 100 Datensätze. Im laufenden Betrieb bleiben höchstens 200 erhalten; das Protokoll zeigt die neuesten 50.`,"The monitor replaces alerts on welcome, retains a bounded live collection, and derives the log, counts, and markers.":`Der Monitor ersetzt seine Alarme bei welcome, hält eine begrenzte Sammlung im laufenden Betrieb und leitet Protokoll, Anzahlen und Markierungen daraus ab.`,"The operator state":`Der Zustand im Leitstand`,"A reducer for one alarm list":`Ein Reducer für eine Alarmliste`,"The control room merges incoming records, tracks in-flight acknowledgements, and keeps the first known acknowledgement.":`Der Leitstand führt eingehende Datensätze zusammen, verfolgt ausstehende Quittierungen und bewahrt die erste bekannte Quittierung.`,"A known recovery gap":`Eine bekannte Wiederherstellungslücke`,"A retained alarm outside welcome.recent can keep a stale status if its acknowledgement was missed while disconnected.":`Ein gehaltener Alarm außerhalb von welcome.recent kann einen veralteten Status behalten, wenn seine Quittierung während einer Verbindungsunterbrechung verpasst wurde.`,"The control room keeps one alarm workflow in a reducer, including pending acknowledgement IDs.":`Der Leitstand hält den Alarmablauf in einem Reducer, einschließlich der IDs ausstehender Quittierungen.`,"The durable record":`Der dauerhafte Datensatz`,"Let the database protect the invariant":`Die Datenbank schützt die Invariante`,"SQLite retains alerts and acknowledgements. The conditional UPDATE makes the first acknowledgement win. The store interface also has an in-memory test implementation.":`SQLite speichert Alarme und Quittierungen dauerhaft. Das bedingte UPDATE lässt die erste Quittierung gewinnen. Für die Store-Schnittstelle gibt es auch eine In-Memory-Testimplementierung.`,"Storage is not an API":`Speicherung ist noch keine API`,"Retaining all alerts does not mean all of them are available in the current UI. Browser snapshots are bounded.":`Alle Alarme zu speichern bedeutet nicht, dass sie alle in der aktuellen Oberfläche verfügbar sind. Browser-Snapshots sind begrenzt.`,"SQLite protects the durable record and first acknowledgement. Browser state does not replace that authority.":`SQLite schützt den dauerhaften Datensatz und die erste Quittierung. Der Browser-Zustand ersetzt diese maßgebliche Quelle nicht.`,"Organized by responsibility.":`Nach Aufgaben geordnet.`,Applications:`Anwendungen`,"own their state and screens. Shared packages expose message contracts, browser connectivity, and generic UI components.":`verwalten ihren Zustand und ihre Ansichten. Gemeinsame Pakete stellen Nachrichtenverträge, Browser-Verbindungen und allgemeine UI-Komponenten bereit.`,"Domain code":`Domänenlogik`,"handles calculations without React or sockets. Injected sources, transports, and clocks make boundary behavior testable.":`führt Berechnungen ohne React oder Sockets aus. Übergebene Datenquellen, Transporte und Uhren machen das Verhalten an den Grenzen testbar.`,Tests:`Tests`,"usually sit next to implementation files. The":`liegen meist neben den Implementierungsdateien. Die`,"folders primarily contain shared setup and fakes.":`-Ordner enthalten vor allem gemeinsame Testeinrichtung und Fakes.`,"Chapter 2 · The guarantees":`Kapitel 2 · Die Garantien`,"Who owns it? What can be lost?":`Wem gehört der Zustand? Was kann verloren gehen?`,"Current behavior & recovery limits":`Aktuelles Verhalten & Wiederherstellungsgrenzen`,"The code shows how an alert moves. Now separate the sensor’s pending work, the relay’s durable record, and the browser’s view. Reconnection does not give every copy the same history.":`Der Code zeigt den Weg eines Alarms. Unterscheide nun die ausstehende Arbeit des Sensors, den dauerhaften Datensatz des Relays und die Browser-Ansicht. Nach dem Wiederverbinden hat nicht jede Kopie dieselbe Historie.`,"The distinction to explain":`Der wichtige Unterschied`,"Reading = measurement. Alert = crossing. accepted = stored. acknowledged = operator response.":`Reading = Messwert. Alert = Grenzwertüberschreitung. accepted = gespeichert. acknowledged = Quittierung durch Bedienpersonal.`,"A relay acceptance completes sensor delivery; an operator acknowledgement is a separate update to the stored alert.":`Eine Speicherbestätigung des Relays schließt die Zustellung vom Sensor ab; eine Quittierung durch Bedienpersonal ist eine separate Änderung am gespeicherten Alarm.`,"1. Follow ownership and lifetime":`1. Zuständigkeit und Lebensdauer verfolgen`,"SERVER AUTHORITY → BROWSER COPIES":`MASSGEBLICHE SERVERDATEN → BROWSER-KOPIEN`,State:`Zustand`,"Who owns it?":`Wer verwaltet ihn?`,"What survives?":`Was bleibt erhalten?`,"Code to inspect":`Relevanter Code`,"Detector side":`Detektorseite`,"Sensor process memory":`Arbeitsspeicher des Sensorprozesses`,"A process restart initializes the side again. A first reading never alerts.":`Ein Prozessneustart initialisiert die Seite erneut. Ein erster Messwert löst nie einen Alarm aus.`,"Detector →":`Detektor →`,Readings:`Messwerte`,"Relay memory and monitor ring buffer":`Relay-Arbeitsspeicher und Monitor-Ringpuffer`,"120 samples in each window. No durable reading history; relay clears its buffer on sensor connect/disconnect.":`120 Messwerte je Fenster. Keine dauerhafte Messwerthistorie; das Relay leert seinen Puffer beim Verbinden oder Trennen eines Sensors.`,"Reading hooks →":`Messwert-Hooks →`,"Unaccepted alerts":`Noch nicht bestätigte Alarme`,"Sensor’s in-memory outbox":`Outbox im Arbeitsspeicher des Sensors`,"50 queued; sent alerts are pending separately. Overflow and process exit can lose alerts.":`50 wartende Einträge; gesendete Alarme werden separat als pending geführt. Überlauf und Prozessende können Alarme verlieren.`,"Outbox →":`Outbox →`,"Accepted alerts and acknowledgements":`Gespeicherte Alarme und Quittierungen`,"Relay SQLite":`SQLite im Relay`,"Persist across process restarts when the database file is retained. No current retention job.":`Bleiben über Prozessneustarts erhalten, wenn die Datenbankdatei erhalten bleibt. Es gibt derzeit keinen automatischen Löschlauf.`,"Alert store →":`Alarm-Store →`,"Threshold and hysteresis":`Schwellwert und Hysterese`,"Relay SQLite; browser and sensor hold copies":`SQLite im Relay; Browser und Sensor halten Kopien`,"Confirmed settings persist per sensor identity. Editing a browser draft does not change the stored value.":`Bestätigte Einstellungen bleiben je Sensoridentität erhalten. Das Bearbeiten eines Browser-Entwurfs ändert den gespeicherten Wert nicht.`,"Monitor store →":`Monitor-Store →`,"Monitor alert collection":`Alarmsammlung des Monitors`,"Redux in that browser tab":`Redux im jeweiligen Browser-Tab`,"200 retained live; 50 shown. welcome replaces the collection with at most 100 recent alerts.":`200 im laufenden Betrieb gehalten; 50 angezeigt. welcome ersetzt die Sammlung durch höchstens 100 aktuelle Alarme.`,"Alerts slice →":`Alarm-Slice →`,"Control-room alarm list":`Alarmliste des Leitstands`,"useReducer in that browser tab":`useReducer im jeweiligen Browser-Tab`,"500 retained. welcome merges at most 100 recent alerts. Reload starts a fresh list.":`500 gehalten. welcome führt höchstens 100 aktuelle Alarme zusammen. Neuladen beginnt mit einer neuen Liste.`,"Alarm reducer →":`Alarm-Reducer →`,"2. Test the same alert against a failure":`2. Denselben Alarm bei einem Fehler betrachten`,"Read proposed improvements →":`Vorgeschlagene Verbesserungen lesen →`,"SQLite stored it; accepted was lost":`SQLite hat gespeichert; accepted ging verloren`,"What happens:":`Was passiert:`,"the sensor retries the same UUID. The relay returns the existing record without broadcasting another alert.":`Der Sensor wiederholt die Zustellung mit derselben UUID. Das Relay liefert den vorhandenen Datensatz zurück, ohne den Alarm erneut zu verteilen.`,"The limit:":`Die Grenze:`,"retries protect alerts still retained by the running sensor. Queue overflow or process exit can lose unaccepted work. Graceful shutdown allows up to three seconds to drain.":`Wiederholungen schützen nur Alarme, die der laufende Sensor noch hält. Warteschlangenüberlauf oder Prozessende können unbestätigte Arbeit verlieren. Beim geordneten Herunterfahren bleiben bis zu drei Sekunden für die Zustellung.`,"Implemented: retry and deduplication. Proposed: a durable sensor outbox.":`Implementiert: Wiederholung und Deduplizierung. Vorgeschlagen: eine dauerhafte Sensor-Outbox.`,"Read the retry code →":`Den Wiederholungscode lesen →`,"Read relay deduplication →":`Deduplizierung im Relay lesen →`,"The browser missed an acknowledgement":`Der Browser hat eine Quittierung verpasst`,"reconnect delivers welcome with the latest 100 alerts by relay receipt time. The monitor replaces its collection; the control room merges into its retained list.":`Beim Wiederverbinden liefert welcome die neuesten 100 Alarme nach Empfangszeit im Relay. Der Monitor ersetzt seine Sammlung; der Leitstand führt sie mit seiner vorhandenen Liste zusammen.`,"an older control-room alarm outside those 100 can remain visibly unacknowledged even when SQLite says it was acknowledged. Retention is not complete reconciliation.":`Ein älterer Alarm im Leitstand außerhalb dieser 100 kann weiterhin als nicht quittiert erscheinen, obwohl SQLite die Quittierung bereits kennt. Aufbewahrung ist kein vollständiger Abgleich.`,"Implemented: bounded snapshots. Proposed: ordered replay or lookup of retained alarm IDs.":`Implementiert: begrenzte Snapshots. Vorgeschlagen: geordnete Ereigniswiedergabe oder Abfrage gehaltener Alarm-IDs.`,"Monitor replacement →":`Ersetzen im Monitor →`,"Control-room merge →":`Zusammenführen im Leitstand →`,"The sensor disconnects after 25.4°C":`Der Sensor trennt sich nach 25,4°C`,"sensorStatus changes the monitor’s sensor information. Existing monitor tabs keep their readings, so the last sample can remain visible.":`sensorStatus ändert die Sensorinformationen des Monitors. Vorhandene Monitor-Tabs behalten ihre Messwerte; der letzte Wert kann deshalb sichtbar bleiben.`,"a visible value is not proof of a fresh measurement. Readings have no durable retry; slow browser connections can also skip them.":`Ein sichtbarer Wert beweist keine aktuelle Messung. Für Messwerte gibt es keine dauerhafte Wiederholung; langsame Browser-Verbindungen können sie ebenfalls überspringen.`,"Implemented: bounded reading windows. Proposed: freshness labels and history if required.":`Implementiert: begrenzte Messwertfenster. Vorgeschlagen: Aktualitätsanzeige und bei Bedarf eine Historie.`,"Read the subscription code →":`Den Abonnement-Code lesen →`,"See the separate UI update paths →":`Die getrennten UI-Aktualisierungswege ansehen →`,"3. Carry the guarantees into the UI":`3. Die Garantien in der Oberfläche berücksichtigen`,"SQLite can be correct while a disconnected tab is stale. React state tools organize the browser’s copy; they do not add replay, persistence, or delivery guarantees to the protocol.":`SQLite kann korrekt sein, während ein getrennter Tab veraltet ist. React-Zustandswerkzeuge organisieren die Browser-Kopie; sie ergänzen das Protokoll nicht um Ereigniswiedergabe, Persistenz oder Zustellgarantien.`,"← Revisit the implementation":`← Zurück zur Implementierung`,"Continue: how React displays this state →":`Weiter: So zeigt React diesen Zustand an →`,"Supporting boundaries: identity and deployment":`Weitere Grenzen: Identität und Bereitstellung`,"Browser session and role":`Browser-Sitzung und Rolle`,"Login sets an HttpOnly, SameSite=Strict session cookie; SQLite stores the token hash. hello checks the requested role. The control room requires the operator role. Logout closes that session’s sockets; heartbeat checks session expiry. Sessions default to 12 hours.":`Die Anmeldung setzt ein HttpOnly-Sitzungscookie mit SameSite=Strict; SQLite speichert den Token-Hash. hello prüft die angeforderte Rolle. Der Leitstand benötigt die Rolle operator. Abmelden schließt die Sockets dieser Sitzung; Heartbeat-Prüfungen kontrollieren den Ablauf. Sitzungen gelten standardmäßig zwölf Stunden.`,"Sensor service identity":`Dienstidentität des Sensors`,"The sensor authenticates with a token in hello. A different sensor ID is refused while another is connected; the same ID replaces its old socket. Acknowledgement identity comes from the operator’s server-side session.":`Der Sensor authentifiziert sich mit einem Token in hello. Eine andere Sensor-ID wird abgewiesen, solange bereits ein Sensor verbunden ist; dieselbe ID ersetzt ihren alten Socket. Die Identität für Quittierungen stammt aus der serverseitigen Sitzung des Bedienpersonals.`,"One relay, one database":`Ein Relay, eine Datenbank`,"Docker Compose runs a relay and a sensor process. The relay writes a persistent volume; the sensor reads the token file through a read-only mount. A reverse proxy provides TLS. Compose enables demo users by default; the server alone does not.":`Docker Compose startet einen Relay- und einen Sensorprozess. Das Relay schreibt auf ein dauerhaftes Volume; der Sensor liest die Token-Datei über einen schreibgeschützten Mount. Ein Reverse Proxy stellt TLS bereit. Compose aktiviert Demo-Benutzer standardmäßig; der Server allein nicht.`,"Chapter 3 · The browser view":`Kapitel 3 · Die Browser-Ansicht`,"From a message to the screen.":`Von der Nachricht auf den Bildschirm.`,"Connect → update state → render":`Verbinden → Zustand aktualisieren → rendern`,"The previous section establishes what the browser can know. React’s job is to subscribe to that data, turn it into view props, and keep input drafts and pending actions clear.":`Das vorherige Kapitel erklärt, was der Browser wissen kann. React abonniert diese Daten, bereitet sie als Props für Ansichten auf und trennt Eingabeentwürfe von ausstehenden Aktionen.`,"The explanation in three steps":`Die Erklärung in drei Schritten`,"main.tsx assembles → App.tsx coordinates → components display.":`main.tsx stellt zusammen → App.tsx koordiniert → Komponenten zeigen an.`,"A custom hook manages the connection lifecycle. Message handlers update the appropriate store; subscribers and selectors expose the result to the UI.":`Ein Custom Hook verwaltet den Verbindungslebenszyklus. Nachrichten-Handler aktualisieren den passenden Store; Abonnements und Selectoren stellen das Ergebnis für die Oberfläche bereit.`,"1. Give each layer one job":`1. Jeder Ebene eine Aufgabe geben`,"Assemble · main.tsx":`Zusammenstellen · main.tsx`,"Create long-lived collaborators":`Langlebige Abhängigkeiten erstellen`,"Check the session and role, supply a stable connection factory, and construct the stores. The monitor supplies Redux through Provider. Tests can substitute fake network dependencies.":`Sitzung und Rolle prüfen, eine stabile Verbindungsfunktion bereitstellen und Stores erstellen. Der Monitor bindet Redux über Provider ein. Tests können Netzwerkabhängigkeiten durch Fakes ersetzen.`,"Coordinate · App.tsx":`Koordinieren · App.tsx`,"Translate messages into state changes":`Nachrichten in Zustandsänderungen übersetzen`,"Use useRelay for connection status and sending. Route readings to the readings store, dispatch alerts and settings, select view data, and pass data and callbacks down to components.":`useRelay liefert den Verbindungsstatus und die Sendefunktion. Messwerte gehen in den Messwert-Store; Alarme und Einstellungen lösen Aktionen aus. Ausgewählte Daten und Callbacks werden an Komponenten weitergegeben.`,"Inspect dispatch and selectors →":`Dispatch und Selectoren ansehen →`,"Display · components":`Anzeigen · Komponenten`,"Render data and collect intent":`Daten darstellen und Benutzerabsichten erfassen`,"The chart, readout, alert log, and settings form receive the data they need. The reading components subscribe through custom hooks. Buttons and forms call supplied callbacks rather than owning the relay connection.":`Diagramm, Messwertanzeige, Alarmprotokoll und Einstellungsformular erhalten die benötigten Daten. Messwertkomponenten abonnieren über Custom Hooks. Schaltflächen und Formulare rufen übergebene Callbacks auf, statt selbst die Relay-Verbindung zu verwalten.`,"2. Route the same sample into the right state":`2. Denselben Messwert dem passenden Zustand zuordnen`,"One crossing, separate reading and alert messages":`Eine Überschreitung, getrennte Messwert- und Alarmnachrichten`,"25.4°C → READING + UPWARD ALERT":`25,4°C → MESSWERT + AUFWÄRTSALARM`,"External readings store":`Externer Messwert-Store`,"updates a window of 120 samples. useReadings and useLatestReading connect the chart and readout to stable snapshots.":`aktualisiert ein Fenster mit 120 Messwerten. useReadings und useLatestReading verbinden Diagramm und Messwertanzeige mit stabilen Snapshots.`,"A reading alone does not add an alarm to the control room.":`Ein Messwert allein fügt im Leitstand keinen Alarm hinzu.`,"Inspect the reading hooks →":`Die Messwert-Hooks ansehen →`,"Monitor Redux state":`Redux-Zustand des Monitors`,"App dispatches slice actions. Selectors derive the alert log, counts, chart markers, and confirmed settings. Sensor status updates the sensor slice.":`App löst Slice-Aktionen aus. Selectoren leiten Alarmprotokoll, Anzahlen, Diagrammmarkierungen und bestätigte Einstellungen ab. Der Sensorstatus aktualisiert den Sensor-Slice.`,"The control room handles its alarm copy in a local useReducer.":`Der Leitstand verwaltet seine Alarmkopie in einem lokalen useReducer.`,"Inspect the Redux path →":`Den Redux-Weg ansehen →`,"Why two paths?":`Warum zwei Wege?`,"Frequent measurements have a small subscriber set; alerts and settings are shared application state. This is a choice about ownership and subscriptions. Redux could also handle this sampling rate. Other prop or state changes can still cause components to render.":`Häufige Messungen haben nur wenige Abonnenten; Alarme und Einstellungen sind gemeinsamer Anwendungszustand. Diese Aufteilung betrifft Zuständigkeiten und Abonnements. Redux könnte diese Messrate ebenfalls verarbeiten. Andere Änderungen an Props oder State können weiterhin Render-Vorgänge auslösen.`,"3. Explain the hooks by their responsibility":`3. Hooks anhand ihrer Aufgabe erklären`,"A custom hook is a function beginning with “use” that reuses React logic. It shares a behavior; shared data comes from the store or connection it uses.":`Ein Custom Hook ist eine mit „use“ beginnende Funktion, die React-Logik wiederverwendet. Er teilt ein Verhalten; gemeinsame Daten kommen aus dem verwendeten Store oder der Verbindung.`,"Own the connection lifecycle":`Den Verbindungslebenszyklus verwalten`,"Shared by the monitor and control room. An effect creates the connection and cleanup disposes it. The connection layer handles transport and reconnection.":`Wird von Monitor und Leitstand verwendet. Ein Effect erstellt die Verbindung; die Bereinigung gibt sie frei. Die Verbindungsschicht übernimmt Transport und Wiederverbindung.`,"useState exposes connection status; useRef holds the connection object.":`useState stellt den Verbindungsstatus bereit; useRef hält das Verbindungsobjekt.`,"useEffect performs setup and cleanup; connect must have a stable identity.":`useEffect übernimmt Einrichtung und Bereinigung; die Identität von connect muss stabil bleiben.`,"useEffectEvent reads current handlers without reconnecting on each render.":`useEffectEvent liest aktuelle Handler, ohne bei jedem Rendern neu zu verbinden.`,"useCallback supplies a stable send function.":`useCallback stellt eine stabile Sendefunktion bereit.`,"Read useRelay →":`useRelay lesen →`,"Subscribe to readings":`Messwerte abonnieren`,"Both wrap useSyncExternalStore. One exposes the whole rolling window; the other exposes the newest sample. A snapshot keeps its reference until the underlying data changes.":`Beide kapseln useSyncExternalStore. Einer liefert das gesamte gleitende Fenster, der andere den neuesten Messwert. Ein Snapshot behält seine Referenz, bis sich die zugrunde liegenden Daten ändern.`,"The same readings store supplies the chart and readout.":`Derselbe Messwert-Store versorgt Diagramm und Messwertanzeige.`,"Subscription cleanup removes the listener on unmount.":`Die Abonnement-Bereinigung entfernt den Listener beim Aushängen der Komponente.`,"useAppDispatch and useAppSelector are separate, typed React Redux hooks.":`useAppDispatch und useAppSelector sind separate, typisierte React-Redux-Hooks.`,"Read the subscription hooks →":`Die Abonnement-Hooks lesen →`,"4. Keep intent separate from confirmation":`4. Benutzerabsicht und Bestätigung trennen`,Interaction:`Interaktion`,"Local state now":`Lokaler Zustand jetzt`,"Confirmed state later":`Bestätigter Zustand später`,"Connection to resilience":`Bezug zur Ausfallsicherheit`,"Edit threshold":`Schwellwert bearbeiten`,"The form holds a text draft. Enter, Apply, or blur validates and commits.":`Das Formular hält einen Textentwurf. Enter, Apply oder das Verlassen des Felds validiert und übernimmt die Eingabe.`,"App sends setSettings. The relay stores it and sends settings; Redux then holds the confirmed value.":`App sendet setSettings. Das Relay speichert die Einstellungen und sendet settings; Redux hält anschließend den bestätigten Wert.`,"Typing “25” must not send an intermediate “2”. Configuration alone does not create a crossing.":`Beim Tippen von „25“ darf nicht zwischenzeitlich „2“ gesendet werden. Eine Konfigurationsänderung allein erzeugt keine Grenzwertüberschreitung.`,"Acknowledge an alarm":`Einen Alarm quittieren`,"The control-room reducer tracks the ID in pendingAcks while awaiting a response.":`Der Reducer des Leitstands verfolgt die ID in pendingAcks, während eine Antwort aussteht.`,"The relay records the first acknowledgement and broadcasts acknowledged. Browser copies update from that confirmation.":`Das Relay speichert die erste Quittierung und verteilt acknowledged. Die Browser-Kopien werden anhand dieser Bestätigung aktualisiert.`,"Sending ack does not prove it was stored.":`Das Senden von ack beweist noch keine Speicherung.`,"Reconnect recovery is bounded →":`Die Wiederherstellung beim Verbinden ist begrenzt →`,"Sensor disconnects":`Sensor trennt die Verbindung`,"The sensor slice changes; the last reading can remain in the readings store.":`Der Sensor-Slice ändert sich; der letzte Messwert kann im Messwert-Store bleiben.`,"A new reading or welcome refreshes the reading view.":`Ein neuer Messwert oder welcome aktualisiert die Messwertansicht.`,"A last known value can be stale.":`Ein zuletzt bekannter Wert kann veraltet sein.`,"Review freshness limits →":`Die Grenzen der Aktualität prüfen →`,"Readout versus detector:":`Messwertanzeige und Detektor:`,"the monitor’s “Above / Below” label compares the current value directly with the threshold. The sensor detector remembers a side and applies hysteresis. They can differ inside the band.":`Die Anzeige „Above / Below“ des Monitors vergleicht den aktuellen Wert direkt mit dem Schwellwert. Der Sensordetektor merkt sich eine Seite und verwendet Hysterese. Innerhalb des Bands können beide voneinander abweichen.`,"Supporting React boundaries: cleanup, loading, and failures":`Weitere React-Grenzen: Bereinigung, Laden und Fehler`,"StrictMode checks cleanup":`StrictMode prüft die Bereinigung`,"In development, the browser apps exercise an extra effect setup/cleanup cycle. Disposing the owned connection closes its socket and cancels retries. Setup → cleanup → setup must be safe.":`In der Entwicklung führen die Browser-Apps einen zusätzlichen Einrichtungs- und Bereinigungszyklus für Effects aus. Das Freigeben der eigenen Verbindung schließt ihren Socket und beendet Wiederholungsversuche. Einrichtung → Bereinigung → Einrichtung muss sicher funktionieren.`,"Inspect connection cleanup →":`Die Verbindungsbereinigung ansehen →`,"Load and fail in small boundaries":`In kleinen Bereichen laden und Fehler abfangen`,"The monitor lazy-loads the chart with a Suspense fallback. Root and panel Error Boundaries isolate render failures. Event-handler and asynchronous errors still need explicit handling.":`Der Monitor lädt das Diagramm bei Bedarf mit einem Suspense-Platzhalter. Error Boundaries auf Root- und Panel-Ebene grenzen Render-Fehler ein. Fehler in Event-Handlern und asynchronen Abläufen brauchen weiterhin eine ausdrückliche Behandlung.`,"Put the three chapters together":`Die drei Kapitel zusammenführen`,"“The sensor detects the crossing, the relay stores the alert, and each browser updates its own view. Delivery is retried while the sensor retains the alert; browser recovery is a bounded snapshot. React keeps measurement subscriptions, shared state, and user intent organized.”":`„Der Sensor erkennt die Überschreitung, das Relay speichert den Alarm, und jeder Browser aktualisiert seine eigene Ansicht. Die Zustellung wird wiederholt, solange der Sensor den Alarm hält; die Browser-Wiederherstellung nutzt einen begrenzten Snapshot. React ordnet Messwert-Abonnements, gemeinsamen Zustand und Benutzerabsichten.“`,"Revisit the code →":`Zurück zum Code →`,"Review the guarantees →":`Die Garantien prüfen →`,"Explore message delivery in the simulator →":`Die Nachrichtenzustellung im Simulator erkunden →`,"Code explorer":`Code-Explorer`,"State & resilience":`Zustand & Ausfallsicherheit`,"React architecture":`React-Architektur`,"Read the code":`Den Code lesen`,"Follow detection, delivery, and display.":`Erkennung, Zustellung und Anzeige verfolgen.`,"Explain the guarantees":`Die Garantien erklären`,"Separate memory, storage, and recovery.":`Arbeitsspeicher, Speicherung und Wiederherstellung unterscheiden.`,"Follow the UI":`Der Oberfläche folgen`,"Connect messages, hooks, and components.":`Nachrichten, Hooks und Komponenten verbinden.`,"One example across all three sections · 24°C → 25.4°C":`Ein Beispiel für alle drei Kapitel · 24°C → 25,4°C`,"The sensor first reads 24°C, then later 25.4°C. With threshold 25°C and hysteresis 0.6°C, 25.4 exceeds the upper edge, 25.3°C. Follow the resulting upward alert through the code.":`Der Sensor misst zuerst 24°C, später 25,4°C. Bei einem Schwellwert von 25°C und einer Hysterese von 0,6°C liegt 25,4 über der oberen Grenze von 25,3°C. Folge dem daraus entstehenden Aufwärtsalarm durch den Code.`,"The same upward alert now has a UUID. Follow that identity from the sensor’s in-memory outbox to SQLite and the browser copies. A stored record and a visible record have different lifetimes.":`Derselbe Aufwärtsalarm besitzt nun eine UUID. Folge dieser Identität von der Outbox im Arbeitsspeicher des Sensors zu SQLite und den Browser-Kopien. Ein gespeicherter und ein sichtbarer Datensatz haben unterschiedliche Lebensdauern.`,"The same 25.4°C sample reaches the monitor as a reading; its crossing arrives separately as an alert. The chart and readout consume the reading, while the alert updates the monitor log and the control-room alarm list.":`Derselbe Messwert von 25,4°C erreicht den Monitor als reading; die Überschreitung kommt separat als alert an. Diagramm und Messwertanzeige verwenden den Messwert, während der Alarm das Monitor-Protokoll und die Alarmliste des Leitstands aktualisiert.`,"Architecture learning path":`Lernpfad zur Architektur`,"Follow the source by responsibility":`Quelldateien nach Aufgaben durchgehen`,"State ownership and recovery":`Zuständigkeit und Wiederherstellung des Zustands`,"User intent and confirmed state":`Benutzerabsicht und bestätigter Zustand`,"Guide section":`Kapitel`,"Source file":`Quelldatei`,"Code excerpt copied.":`Codeauszug kopiert.`,"Excerpt selected. Press Ctrl+C or ⌘C to copy.":`Codeauszug ausgewählt. Zum Kopieren Strg+C oder ⌘C drücken.`,"Pick a file to see its job, the code, and where it connects to the other sections.":`Wähle eine Datei: Sieh dir ihre Aufgabe, den Code und die Verbindung zu den anderen Kapiteln an.`,"More files":`Weitere Dateien`,"More detail":`Weitere Details`,"The relay stores the durable record. The sensor and browsers also hold temporary state.":`Das Relay speichert den dauerhaften Datensatz. Sensor und Browser halten zusätzlich vorübergehenden Zustand.`,"Where state lives":`Wo der Zustand liegt`,Part:`Bereich`,"What it keeps":`Was er speichert`,Sensor:`Sensor`,"Detector and outbox in memory. Unaccepted alerts can be lost on exit or overflow.":`Detektor und Outbox liegen im Arbeitsspeicher. Nicht bestätigte Alarme können bei Prozessende oder Überlauf verloren gehen.`,Relay:`Relay`,"SQLite stores alerts, acknowledgements, and settings across restarts.":`SQLite bewahrt Alarme, Quittierungen und Einstellungen über Neustarts hinweg.`,"Relay and monitor keep 120 samples in memory. No durable history.":`Relay und Monitor halten 120 Messwerte im Arbeitsspeicher. Es gibt keine dauerhafte Historie.`,Monitor:`Live-Monitor`,"Redux holds a browser copy. welcome replaces its alert collection.":`Redux hält eine Browser-Kopie. welcome ersetzt die Alarmsammlung.`,"Control room":`Leitstand`,"A reducer holds a browser copy. welcome merges recent alarms.":`Ein Reducer hält eine Browser-Kopie. welcome führt aktuelle Alarme zusammen.`,"Three failure cases to remember":`Drei wichtige Fehlerfälle`,"Lost storage confirmation":`Verlorene Speicherbestätigung`,"The sensor retries the same UUID; the relay avoids duplicates. This only works while the sensor still retains the alert.":`Der Sensor sendet dieselbe UUID erneut; das Relay verhindert Duplikate. Das funktioniert nur, solange der Sensor den Alarm noch hält.`,"Missed acknowledgement":`Verpasste Quittierung`,"welcome contains at most 100 recent alerts. An older control-room alarm can stay stale after reconnecting.":`welcome enthält höchstens 100 aktuelle Alarme. Ein älterer Alarm im Leitstand kann nach dem Wiederverbinden veraltet bleiben.`,"Read the alarm reducer →":`Den Alarm-Reducer lesen →`,"Disconnected sensor":`Getrennter Sensor`,"The last reading can stay visible after disconnecting. A visible value does not prove the sensor is still measuring.":`Der letzte Messwert kann nach einer Trennung sichtbar bleiben. Ein sichtbarer Wert beweist nicht, dass der Sensor weiterhin misst.`,"Read the reading hooks →":`Die Messwert-Hooks lesen →`,"Exact limits and recovery details":`Genaue Grenzen und Wiederherstellung`,"The monitor retains 200 alerts live and shows 50. The control room retains 500. Snapshots are bounded; full replay and a durable sensor outbox are proposed improvements.":`Der Monitor hält im laufenden Betrieb 200 Alarme und zeigt 50. Der Leitstand hält 500. Snapshots sind begrenzt; eine vollständige Ereigniswiedergabe und eine dauerhafte Sensor-Outbox sind vorgeschlagene Verbesserungen.`,"accepted = stored.":`accepted = gespeichert.`,"acknowledged = operator response.":`acknowledged = Quittierung durch Bedienpersonal.`,"App receives messages, updates state, and passes data to components.":`App empfängt Nachrichten, aktualisiert den Zustand und gibt Daten an Komponenten weiter.`,"Three responsibilities":`Drei Aufgaben`,"main.tsx":`main.tsx`,"Creates stores and supplies the connection factory.":`Erstellt Stores und stellt die Verbindungsfunktion bereit.`,"App.tsx":`App.tsx`,"Turns messages into state updates and selects data for the views.":`Übersetzt Nachrichten in Zustandsänderungen und wählt Daten für die Ansichten aus.`,Components:`Komponenten`,"Display data and send user actions through callbacks.":`Zeigen Daten an und geben Benutzeraktionen über Callbacks weiter.`,"Two paths for incoming data":`Zwei Wege für eingehende Daten`,"A separate readings store feeds the chart and readout through custom hooks.":`Ein separater Messwert-Store versorgt Diagramm und Messwertanzeige über Custom Hooks.`,"Alerts and settings":`Alarme und Einstellungen`,"The monitor uses Redux Toolkit. The control room uses useReducer for its alarm list.":`Der Monitor verwendet Redux Toolkit. Der Leitstand verwendet useReducer für seine Alarmliste.`,"Sending is not confirmation":`Senden ist noch keine Bestätigung`,"Change a setting":`Eine Einstellung ändern`,"The form keeps a local draft. App sends setSettings; the confirmed value comes back from the relay.":`Das Formular hält einen lokalen Entwurf. App sendet setSettings; der bestätigte Wert kommt vom Relay zurück.`,"The control room marks the request as pending. Its alarm changes only when acknowledged arrives from the relay.":`Der Leitstand markiert die Anfrage als ausstehend. Der Alarm wird erst aktualisiert, wenn acknowledged vom Relay eintrifft.`,"Custom hooks: connection and subscriptions":`Custom Hooks: Verbindung und Abonnements`,"Repository structure":`Repository-Struktur`,"State, actions, and the UI.":`Zustand, Aktionen und Oberfläche.`,"Start with the monitor’s Redux state. Then follow an incoming message through a reducer and into the UI.":`Beginne mit dem Redux-Zustand des Monitors. Verfolge dann eine eingehende Nachricht durch einen Reducer bis zur Oberfläche.`,"Code reading order":`Lesereihenfolge im Code`,"1 · State":`1 · Zustand`,"2 · Reducers":`2 · Reducer`,"3 · Messages & UI":`3 · Nachrichten & Oberfläche`,"Redux state":`Redux-Zustand`,"Actions & reducers":`Aktionen & Reducer`,"Messages & selectors":`Nachrichten & Selectoren`,"Monitor: the important path":`Monitor: der zentrale Ablauf`,"Hooks & control room":`Hooks & Leitstand`,"Sensor & server code":`Sensor- & Server-Code`,"1 · What is in the store?":`1 · Was liegt im Store?`,"The actual initial Redux state":`Der tatsächliche Redux-Anfangszustand`,"Each monitor tab starts with this state. The relay’s welcome message fills it with confirmed settings, recent alerts, and the connected sensor.":`Jeder Monitor-Tab beginnt mit diesem Zustand. Die welcome-Nachricht des Relays füllt ihn mit bestätigten Einstellungen, aktuellen Alarmen und dem verbundenen Sensor.`,"Initial shape produced by createAppStore().getState() ·":`Anfangsstruktur von createAppStore().getState() ·`,"State field":`Zustandsfeld`,"What it holds":`Was es enthält`,"Used by":`Verwendet von`,"Confirmed threshold and hysteresis; null until received.":`Bestätigter Schwellwert und Hysterese; bis zum Empfang null.`,"Settings form, chart, readout":`Einstellungsformular, Diagramm, Messwertanzeige`,"Alert IDs in event-time order, with records indexed by UUID.":`Alarm-IDs nach Ereigniszeit und nach UUID indizierte Datensätze.`,"Alert log, counts, chart markers":`Alarmprotokoll, Anzahlen, Diagrammmarkierungen`,"Connected sensor information, or null when none is connected.":`Informationen zum verbundenen Sensor oder null, wenn keiner verbunden ist.`,"Online status, sensor panel":`Verbindungsstatus, Sensoranzeige`,"ids + entities = normalized state":`ids + entities = normalisierter Zustand`,"ids controls the display order. entities[id] retrieves that alert directly. Counts and chart markers are derived by selectors; they are not separate copies in state. Live readings stay in their own ring buffer.":`ids bestimmt die Reihenfolge. entities[id] liefert den zugehörigen Alarm direkt. Anzahlen und Diagrammmarkierungen werden durch Selectoren abgeleitet und nicht zusätzlich im Zustand gespeichert. Laufende Messwerte bleiben im eigenen Ringpuffer.`,"How the three slices are combined":`Wie die drei Slices kombiniert werden`,"Next: which actions change these fields? →":`Weiter: Welche Aktionen ändern diese Felder? →`,"2 · What changes the state?":`2 · Was ändert den Zustand?`,"Actions change specific fields":`Aktionen ändern konkrete Felder`,Action:`Aktion`,"State change":`Zustandsänderung`,"Replace alerts from the reconnect snapshot.":`Alarme durch den Wiederverbindungs-Snapshot ersetzen.`,"Insert or update one alert by UUID; keep a known acknowledgement.":`Einen Alarm per UUID einfügen oder aktualisieren; eine bekannte Quittierung erhalten.`,"Set entities[id].acknowledgement if that alarm exists and has no acknowledgement yet.":`entities[id].acknowledgement setzen, wenn der Alarm existiert und noch nicht quittiert wurde.`,"Replace settings.current with the relay-confirmed settings.":`settings.current durch die vom Relay bestätigten Einstellungen ersetzen.`,"Replace sensor.sensor with the current sensor or null.":`sensor.sensor durch den aktuellen Sensor oder null ersetzen.`,"Why these assignments are safe":`Warum diese Zuweisungen sicher sind`,"createSlice uses Immer. These reducers edit a draft; Redux receives an immutable next state. The first known acknowledgement is preserved.":`createSlice verwendet Immer. Diese Reducer ändern einen Entwurf; Redux erhält einen unveränderlichen Folgezustand. Die erste bekannte Quittierung bleibt erhalten.`,"Settings and sensor reducers":`Einstellungs- und Sensor-Reducer`,"Next: messages → actions → selectors → UI →":`Weiter: Nachrichten → Aktionen → Selectoren → Oberfläche →`,"3 · How does the screen update?":`3 · Wie aktualisiert sich die Oberfläche?`,"Message → action → state → selector → component":`Nachricht → Aktion → Zustand → Selector → Komponente`,"App.tsx translates relay messages into actions. Redux runs the reducers. useAppSelector reads the values the components need.":`App.tsx übersetzt Relay-Nachrichten in Aktionen. Redux führt die Reducer aus. useAppSelector liest die von den Komponenten benötigten Werte.`,"Selectors derive values instead of duplicating state":`Selectoren leiten Werte ab, statt Zustand zu duplizieren`,"One concrete example":`Ein konkretes Beispiel`,"acknowledged arrives → the reducer updates alerts.entities[id].acknowledgement → selectLoggedAlerts and selectAlertCounts recompute → the monitor displays the acknowledgement and updated counts. This does not mark the sensor outbox accepted; that is a different message.":`acknowledged trifft ein → der Reducer aktualisiert alerts.entities[id].acknowledgement → selectLoggedAlerts und selectAlertCounts berechnen sich neu → der Monitor zeigt die Quittierung und aktualisierte Anzahlen. Das bestätigt nicht die Sensor-Outbox; dafür gibt es eine andere Nachricht.`,"Code worth explaining.":`Code, den ich erklären kann.`,"Decisions in the code":`Entscheidungen im Code`,"Start with Redux, then explore the decisions behind detection, reliable delivery, and React state. Each example connects a concrete problem to the code that handles it.":`Beginne mit Redux und erkunde dann die Entscheidungen hinter Erkennung, zuverlässiger Übertragung und React-Zustand. Jedes Beispiel verbindet ein konkretes Problem mit dem passenden Code.`,"React boundaries":`React-Grenzen`,"Connection lifecycle":`Verbindungslebenszyklus`,"Live readings":`Live-Messwerte`,"Draft vs. confirmed state":`Entwurf und bestätigter Zustand`,"Detection & delivery":`Erkennung und Übertragung`,"How to explain this decision":`So lässt sich die Entscheidung erklären`,"Related example →":`Verwandtes Beispiel →`,"Local editing, shared truth":`Lokal bearbeiten, gemeinsamen Zustand bestätigen`,"Typing is not a settings update":`Tippen ändert noch keine Einstellung`,"Typing “25” must not briefly set the shared threshold to 2. Keep the draft in component state; validate and commit on Enter, Apply, or blur.":`Beim Tippen von „25“ darf der gemeinsame Grenzwert nicht kurz auf 2 springen. Der Entwurf bleibt im Komponenten-Zustand; geprüft und übernommen wird mit Enter, Anwenden oder beim Verlassen des Feldes.`,"The form owns an editable string. Redux owns the server-confirmed numeric setting. Invalid input stays local, and a valid commit requests a change rather than pretending it is already confirmed.":`Das Formular verwaltet den bearbeitbaren Text. Redux verwaltet den vom Server bestätigten Zahlenwert. Ungültige Eingaben bleiben lokal; eine gültige Eingabe fordert eine Änderung an, deren Bestätigung noch aussteht.`,"Tradeoff: confirmation takes a network round trip. The active value remains visible while the draft differs.":`Abwägung: Die Bestätigung benötigt eine Netzwerk-Rundreise. Der aktive Wert bleibt sichtbar, solange der Entwurf davon abweicht.`,"Follow the server response →":`Serverantwort verfolgen →`,"The producer and subscription contract":`Erzeuger und Abonnement-Vertrag`,"Confirmation removes the pending alert":`Die Bestätigung entfernt den wartenden Alarm`,"A deadline returns it to the retry queue":`Nach Ablauf der Frist wird erneut gesendet`,"Inject the source and transport so the same coordinator can run against real connections or test doubles.":`Quelle und Transport werden injiziert. Derselbe Koordinator kann damit echte Verbindungen oder Test-Doubles verwenden.`,"Keep detection pure: the same previous state, reading, and settings produce the same decision. Hysteresis prevents repeated alerts around one boundary.":`Die Erkennung bleibt rein: Vorheriger Zustand, Messwert und Einstellungen bestimmen die Entscheidung. Hysterese verhindert wiederholte Alarme nahe derselben Grenze.`,"Retries reuse the same UUID. The relay confirms an existing record instead of broadcasting a duplicate alert.":`Wiederholungen verwenden dieselbe UUID. Der Relay bestätigt einen vorhandenen Datensatz, statt einen doppelten Alarm zu verteilen.`,"A socket write is not delivery confirmation. Keep the alert pending until the relay accepts its UUID; retry after a deadline. Memory is bounded, so overflow or process loss can still lose queued alerts.":`Ein Socket-Schreibvorgang bestätigt keine Zustellung. Der Alarm bleibt offen, bis der Relay seine UUID bestätigt; nach Ablauf der Frist wird erneut gesendet. Der Speicher ist begrenzt: Überlauf oder Prozessverlust können wartende Alarme verlieren.`,"Give one effect ownership of the connection and its cleanup. Components consume messages without owning reconnect machinery.":`Ein Effekt besitzt Verbindung und Aufräumlogik. Komponenten empfangen Nachrichten, ohne selbst Wiederverbindungen zu steuern.`,"Use a bounded external store for transient samples and Redux for shared application records. This adds a second subscription mechanism, but makes the two lifetimes explicit.":`Ein begrenzter externer Speicher hält flüchtige Messwerte, Redux die gemeinsamen Anwendungsdaten. Ein zweiter Abonnement-Mechanismus macht diese unterschiedlichen Lebensdauern explizit.`,"Redux Toolkit gives shared state explicit actions, normalized alerts, and derived selectors. Form drafts stay local; live samples use a separate bounded buffer.":`Redux Toolkit liefert explizite Aktionen, normalisierte Alarme und abgeleitete Selektoren für gemeinsamen Zustand. Formularentwürfe bleiben lokal; Live-Messwerte liegen in einem separaten begrenzten Puffer.`,"Translate incoming protocol messages into state updates at one boundary. Components select the data they render instead of parsing socket messages.":`Eingehende Protokollnachrichten werden an einer Grenze in Zustandsänderungen übersetzt. Komponenten wählen ihre Anzeigedaten aus, statt Socket-Nachrichten auszuwerten.`,"Immer makes reducer updates concise while Redux retains immutable state transitions. Normalized IDs let an acknowledgement update one existing alert.":`Immer vereinfacht Reducer, während Redux unveränderliche Zustandsübergänge beibehält. Normalisierte IDs erlauben die Bestätigung eines einzelnen vorhandenen Alarms.`,"A small alarm list uses a focused reducer. The UI marks an alarm acknowledged only after the server response, so it does not claim success before persistence.":`Eine kleine Alarmliste nutzt einen eigenen Reducer. Erst die Serverantwort markiert einen Alarm als bestätigt; die Oberfläche meldet keinen Erfolg vor der Speicherung.`,"Persist acknowledgements on the server and keep the first acknowledgement authoritative. Browser state is a view of that record.":`Bestätigungen werden auf dem Server gespeichert; die erste Bestätigung bleibt maßgeblich. Der Browser zeigt eine Sicht auf diesen Datensatz.`,"Shared state":`Gemeinsamer Zustand`,Example:`Beispiel`,"Choose a code example":`Codebeispiel auswählen`,Packages:`Pakete`,"Live Monitor":`Live-Monitor`,"Control Room":`Leitstand`,Input:`Eingabe`,Output:`Ausgabe`,"Reading source":`Messwertquelle`,"Agent subscription":`Abonnement im Agenten`,"Crossing detector":`Grenzwertdetektor`,"Delivery outbox":`Übertragungs-Outbox`,"Route an alert":`Alarm weiterleiten`,"Durable alert records":`Dauerhafte Alarmdatensätze`,"Confirm acknowledgement":`Bestätigung verarbeiten`,"Messages → UI":`Nachrichten → Oberfläche`,"Live reading subscriptions":`Live-Messwerte abonnieren`,"Draft vs. confirmed settings":`Entwurf und bestätigte Einstellungen`,"Alarm list reducer":`Reducer der Alarmliste`,"Message contracts":`Nachrichtenverträge`,"Shared table contract":`Gemeinsamer Tabellenvertrag`,"← Previous example":`← Vorheriges Beispiel`,"Next example →":`Nächstes Beispiel →`,"Source examples by project part":`Codebeispiele nach Projektteil`,"Code examples":`Codebeispiele`,"Example navigation":`Beispielnavigation`,"Produce a reading before detecting an alert":`Erst einen Messwert erzeugen, dann einen Alarm erkennen`,"The source emits timestamped measurements. Its subscribers decide what those measurements mean.":`Die Quelle liefert Messwerte mit Zeitstempel. Ihre Abonnenten bestimmen, was diese Messwerte bedeuten.`,"The clock decides which samples are due; an injected scheduler makes late ticks testable. Catch-up is capped at one minute, so a long suspension can leave a gap.":`Die Uhr bestimmt, welche Messwerte fällig sind; ein injizierter Scheduler macht verspätete Ticks testbar. Das Nachholen ist auf eine Minute begrenzt, daher kann eine lange Pause eine Lücke hinterlassen.`,"Share contracts across process boundaries":`Verträge über Prozessgrenzen teilen`,"Runtime schemas validate incoming messages; inferred TypeScript types keep the four applications aligned.":`Laufzeitschemas prüfen eingehende Nachrichten; abgeleitete TypeScript-Typen halten die vier Anwendungen auf demselben Stand.`,"A TypeScript type cannot validate network input. Parsing checks the actual payload and returns a result the relay can handle without an uncaught JSON error.":`Ein TypeScript-Typ kann Netzwerkeingaben nicht prüfen. Das Parsen prüft die tatsächlichen Daten und liefert dem Relay ein Ergebnis ohne unbehandelten JSON-Fehler.`,"Close the acknowledgement loop":`Den Bestätigungsablauf abschließen`,"The Control Room sends an alert ID. The relay uses the authenticated session identity, stores the acknowledgement, and broadcasts the result.":`Der Leitstand sendet eine Alarm-ID. Der Relay verwendet die Identität der authentifizierten Sitzung, speichert die Bestätigung und verteilt das Ergebnis.`,"The server owns acknowledgement truth. The database preserves the first acknowledgement; both browser apps update their copies from the returned result.":`Der Server verwaltet den maßgeblichen Bestätigungszustand. Die Datenbank bewahrt die erste Bestätigung; beide Browser-Apps aktualisieren ihre Kopien anhand des Ergebnisses.`,"Reuse a table contract, keep domain rules in the apps":`Tabellenvertrag teilen, Fachregeln in den Apps belassen`,"The shared table accepts column definitions. Each application supplies its own cells and actions.":`Die gemeinsame Tabelle akzeptiert Spaltendefinitionen. Jede Anwendung liefert ihre eigenen Zellen und Aktionen.`,"Share rendering behavior such as sticky headers and scrolling. Keep alert formatting, permissions, and acknowledgement actions in the applications that own those decisions.":`Darstellungsverhalten wie feste Tabellenköpfe und Scrollen wird geteilt. Alarmformatierung, Berechtigungen und Bestätigungsaktionen bleiben in den zuständigen Anwendungen.`,"Clock and sample rate":`Uhr und Abtastrate`,"Timestamped readings":`Messwerte mit Zeitstempel`,"Reading and confirmed settings":`Messwert und bestätigte Einstellungen`,"Reading message and optional alert":`Messwertnachricht und optionaler Alarm`,"Previous side, reading, settings":`Vorherige Seite, Messwert, Einstellungen`,"Next side and optional crossing":`Nächste Seite und optionaler Übergang`,"Alert UUID and current time":`Alarm-UUID und aktuelle Zeit`,"Pending sends, acceptance, or retries":`Offene Sendungen, Annahme oder Wiederholungen`,"Validated sensor alert":`Geprüfter Sensoralarm`,"Stored record, acceptance, browser broadcast":`Gespeicherter Datensatz, Annahme, Verteilung an Browser`,"Alert or acknowledgement write":`Alarm oder Bestätigung speichern`,"Durable authoritative record":`Dauerhafter maßgeblicher Datensatz`,"Relay message":`Relay-Nachricht`,"Action, selected state, rendered UI":`Aktion, ausgewählter Zustand, gerenderte Oberfläche`,"Shared application records":`Gemeinsame Anwendungsdaten`,"Settings, normalized alerts, sensor state":`Einstellungen, normalisierte Alarme, Sensorzustand`,"Typed Redux action":`Typisierte Redux-Aktion`,"Immutable state transition":`Unveränderlicher Zustandsübergang`,"Alert or acknowledgement message":`Alarm- oder Bestätigungsnachricht`,"Updated operator alarm list":`Aktualisierte Alarmliste des Operators`,"Alert ID and session identity":`Alarm-ID und Sitzungsidentität`,"Stored acknowledgement broadcast":`Verteilung der gespeicherten Bestätigung`,"Editable form draft":`Bearbeitbarer Formularentwurf`,"Validated settings request":`Geprüfte Einstellungsanfrage`,"Live reading stream":`Live-Messwertstrom`,"Bounded snapshots for subscribers":`Begrenzte Momentaufnahmen für Abonnenten`,"Untrusted network payload":`Nicht vertrauenswürdige Netzwerkdaten`,"Validated message or explicit error":`Geprüfte Nachricht oder expliziter Fehler`,"Stable connection factory and handlers":`Stabile Verbindungsfunktion und Handler`,"Connection status, messages, send function":`Verbindungsstatus, Nachrichten, Sendefunktion`,"Rows and column definitions":`Zeilen und Spaltendefinitionen`,"Reusable scrollable table":`Wiederverwendbare scrollbarere Tabelle`,"Highlighted lines":`Markierte Zeilen`,"Create a timestamped reading, then notify the source subscribers.":`Einen Messwert mit Zeitstempel erzeugen und die Abonnenten der Quelle benachrichtigen.`,"Run detection for every reading; send an alert only when a crossing exists.":`Jeden Messwert prüfen; nur bei einem Übergang einen Alarm senden.`,"Switch sides only beyond the upper or lower edge; equality does not trigger.":`Die Seite nur jenseits der oberen oder unteren Grenze wechseln; Gleichheit löst nichts aus.`,"Sending assigns a deadline and moves queued alerts into pending, rather than deleting them.":`Beim Senden erhalten Alarme eine Frist und wechseln in den offenen Zustand, statt gelöscht zu werden.`,"Relay acceptance removes the matching UUID from both possible locations.":`Die Annahme durch den Relay entfernt die passende UUID aus beiden möglichen Ablagen.`,"Expired pending entries return to the queue in creation order.":`Abgelaufene offene Einträge kehren in Erstellungsreihenfolge in die Warteschlange zurück.`,"A duplicate gets acceptance again; a new alert is stored and distributed to the browser views.":`Ein Duplikat wird erneut angenommen; ein neuer Alarm wird gespeichert und an die Browser verteilt.`,"SQL enforces unique alert IDs and updates acknowledgement only while it is still empty.":`SQL erzwingt eindeutige Alarm-IDs und schreibt eine Bestätigung nur, solange sie noch leer ist.`,"Readings go to the transient buffer; alerts become Redux actions.":`Messwerte gehen in den flüchtigen Puffer; Alarme werden zu Redux-Aktionen.`,"Derive the visible log from stored alerts instead of keeping a second collection.":`Das sichtbare Protokoll aus gespeicherten Alarmen ableiten, statt eine zweite Sammlung zu halten.`,"The component reads the derived alert view through a selector.":`Die Komponente liest die abgeleitete Alarmsicht über einen Selektor.`,"The initial alert collection has an ordered ID list and a lookup map.":`Die anfängliche Alarmsammlung enthält eine geordnete ID-Liste und eine Zuordnungstabelle.`,"Create the store with the combined application reducer.":`Den Store mit dem kombinierten Anwendungs-Reducer erzeugen.`,"Ignore unknown or already acknowledged records; Immer applies the update to a known alert.":`Unbekannte oder bereits bestätigte Datensätze ignorieren; Immer aktualisiert einen bekannten Alarm.`,"Replace the shared setting with the server-confirmed record.":`Die gemeinsame Einstellung durch den vom Server bestätigten Datensatz ersetzen.`,"Store the reported sensor, or null when it disconnects.":`Den gemeldeten Sensor speichern oder null, wenn er die Verbindung trennt.`,"Merge reconnect snapshots and live alerts into the operator’s existing list.":`Wiederverbindungs-Snapshots und Live-Alarme mit der bestehenden Operator-Liste zusammenführen.`,"Persist using the session identity, then broadcast the acknowledgement returned by storage.":`Mit der Sitzungsidentität speichern und anschließend die gespeicherte Bestätigung verteilen.`,"Validate the local draft, then request a change only when the numeric value differs.":`Den lokalen Entwurf prüfen und nur bei einem anderen Zahlenwert eine Änderung anfordern.`,"React subscribes to the external store and reads either the window or the latest value.":`React abonniert den externen Speicher und liest das Messfenster oder den neuesten Wert.`,"Keep a bounded readings buffer and notify subscribers when a reading is pushed.":`Einen begrenzten Messwertpuffer führen und Abonnenten bei einem neuen Messwert benachrichtigen.`,"An acknowledgement request carries its type and alert ID; operator identity comes from the session.":`Eine Bestätigungsanfrage enthält Typ und Alarm-ID; die Operator-Identität stammt aus der Sitzung.`,"Validate incoming data against the shared client-message schema.":`Eingehende Daten anhand des gemeinsamen Client-Nachrichtenschemas prüfen.`,"The effect creates the connection, and its cleanup disposes that same connection.":`Der Effekt erstellt die Verbindung und seine Aufräumfunktion beendet dieselbe Verbindung.`,"Each application supplies a renderer for its own typed row.":`Jede Anwendung liefert einen Renderer für ihren eigenen typisierten Datensatz.`,Why:`Warum`,About:`Aufgabe`,"Generates simulated temperature readings at the configured rate and delivers them to subscribers. Each reading contains a scheduled timestamp and a value.":`Erzeugt simulierte Temperaturmesswerte mit der konfigurierten Rate und liefert sie an Abonnenten. Jeder Messwert enthält einen geplanten Zeitstempel und einen Wert.`,"Coordinates the sensor workflow: receives readings, applies confirmed settings, runs the crossing detector, and hands readings and new alerts to the transport.":`Koordiniert den Sensorablauf: empfängt Messwerte, übernimmt bestätigte Einstellungen, führt den Grenzwertdetektor aus und übergibt Messwerte sowie neue Alarme an den Transport.`,"Compares a reading with the hysteresis edges and the previous detector state. Returns the next state and, when the side changes, an upward or downward crossing event.":`Vergleicht einen Messwert mit den Hysteresegrenzen und dem bisherigen Detektorzustand. Liefert den nächsten Zustand und bei einem Seitenwechsel ein aufwärts oder abwärts gerichtetes Übergangsereignis.`,"Tracks alerts waiting to be sent or accepted. Its pure functions move entries between queued and pending states, remove accepted UUIDs, and requeue expired sends.":`Verwaltet Alarme, die auf Versand oder Annahme warten. Reine Funktionen verschieben Einträge zwischen Warteschlange und offenem Zustand, entfernen angenommene UUIDs und stellen abgelaufene Sendungen erneut an.`,"Handles an incoming sensor alert. If its UUID already exists, returns acceptance again. Otherwise stores the record and prepares messages for the sensor and browser apps.":`Verarbeitet einen eingehenden Sensoralarm. Existiert seine UUID bereits, wird die Annahme erneut zurückgegeben. Andernfalls wird der Datensatz gespeichert und Nachrichten für Sensor und Browser-Apps werden vorbereitet.`,"Stores alert records and acknowledgements in SQLite. Provides lookup by UUID and queries for recent alerts, so these records survive a relay restart.":`Speichert Alarmdatensätze und Bestätigungen in SQLite. Bietet UUID-Abfragen und Abfragen neuer Alarme, damit diese Datensätze einen Relay-Neustart überstehen.`,"Connects relay messages to the Live Monitor screen. Dispatches shared-record updates to Redux, pushes readings into their buffer, and selects the data components render.":`Verbindet Relay-Nachrichten mit dem Live-Monitor. Aktualisierungen gemeinsamer Datensätze werden an Redux gesendet, Messwerte in ihren Puffer geschrieben und Anzeigedaten über Selektoren gelesen.`,"Creates the Live Monitor store with settings, alerts, and sensor slices. Exposes typed React hooks for dispatching actions and selecting state.":`Erzeugt den Live-Monitor-Store mit Slices für Einstellungen, Alarme und Sensor. Stellt typisierte React-Hooks zum Auslösen von Aktionen und Auswählen von Zustand bereit.`,"Updates Redux records when the relay sends a snapshot, a new alert, an acknowledgement, confirmed settings, or sensor status. Alerts are indexed by UUID.":`Aktualisiert Redux-Datensätze bei Snapshots, neuen Alarmen, Bestätigungen, bestätigten Einstellungen oder Sensorstatus vom Relay. Alarme werden nach UUID indiziert.`,"Maintains the Control Room alarm list. Merges incoming records, applies acknowledgements, tracks requests still in flight, and lets the operator clear acknowledged rows locally.":`Verwaltet die Alarmliste im Leitstand. Führt eingehende Datensätze zusammen, übernimmt Bestätigungen, verfolgt offene Anfragen und erlaubt das lokale Entfernen bestätigter Zeilen.`,"Processes an operator’s acknowledgement request on the relay. Looks up the alert, records the session user if it is still unacknowledged, and returns the stored result to clients.":`Verarbeitet die Bestätigungsanfrage eines Operators im Relay. Sucht den Alarm, speichert bei noch fehlender Bestätigung den Sitzungsbenutzer und gibt das gespeicherte Ergebnis an Clients zurück.`,"Keeps typed threshold text local while the user edits. Validates it on commit and calls the supplied callback to request a shared settings change.":`Hält eingegebenen Grenzwerttext während der Bearbeitung lokal. Prüft ihn beim Übernehmen und ruft den übergebenen Callback auf, um eine gemeinsame Einstellungsänderung anzufordern.`,"Keeps a bounded window of live readings outside Redux. React hooks subscribe to that store so the chart and readout receive the latest snapshot.":`Hält ein begrenztes Fenster von Live-Messwerten außerhalb von Redux. React-Hooks abonnieren diesen Speicher, damit Diagramm und Messwertanzeige den neuesten Snapshot erhalten.`,"Defines the messages exchanged by sensor, relay, and browser apps. Parses incoming JSON and checks its structure against the shared runtime schemas.":`Definiert die Nachrichten zwischen Sensor, Relay und Browser-Apps. Parst eingehendes JSON und prüft dessen Struktur anhand gemeinsamer Laufzeitschemas.`,"Connects a mounted React component to the relay. Forwards messages to its handlers, exposes connection status and sending, and disposes the connection on unmount.":`Verbindet eine gemountete React-Komponente mit dem Relay. Leitet Nachrichten an Handler weiter, stellt Verbindungsstatus und Sendefunktion bereit und beendet die Verbindung beim Unmounten.`,"Renders typed rows using column definitions supplied by each app. Provides a scrollable table with sticky column headers; the apps supply cell formatting and actions.":`Stellt typisierte Zeilen anhand der Spaltendefinitionen der jeweiligen App dar. Bietet eine scrollbare Tabelle mit festen Spaltenüberschriften; Zellenformatierung und Aktionen kommen aus den Apps.`,"System overview":`Systemübersicht`,"Live simulator":`Live-Simulator`,"Architecture Guide":`Architekturleitfaden`,Architecture:`Architektur`,"Threshold Monitor architecture":`Architektur von Threshold Monitor`,"Threshold Monitor / Architecture Guide":`Threshold Monitor / Architekturleitfaden`,"Sensor service":`Sensordienst`,"Relay server":`Relay-Server`,"SQLite storage":`SQLite-Speicher`,"Explore the system":`System erkunden`,"Explore implementation {6}":`Implementierung ansehen {6}`,"Key source files":`Wichtige Quelldateien`,"Contracts & concepts":`Verträge und Konzepte`,"Guide sections":`Abschnitte des Leitfadens`,"Skip to content":`Zum Inhalt springen`,"Collapse navigation":`Navigation einklappen`,"Expand navigation":`Navigation ausklappen`,"Close navigation":`Navigation schließen`,"Search the guide":`Leitfaden durchsuchen`,"Search results":`Suchergebnisse`,"Find a concept or file…":`Konzept oder Datei suchen …`,"Print or save as PDF":`Drucken oder als PDF speichern`,"Print or save guide as PDF":`Leitfaden drucken oder als PDF speichern`,"Read architecture documentation ↗":`Architekturdokumentation lesen ↗`,Proposals:`Vorschläge`,"Source snapshot · 19 Oct 2026 ·":`Quellstand · 19. Okt. 2026 ·`,"A source-grounded reference for understanding, reviewing, and explaining the system.":`Eine Referenz auf Basis des Quellcodes, um das System zu verstehen, zu prüfen und zu erklären.`,"A sensor detects a change. A relay makes it durable. Two browser apps give people a live view and a way to respond. Explore how the pieces fit together.":`Ein Sensor erkennt eine Änderung. Ein Relay speichert sie dauerhaft. Zwei Browser-Apps zeigen Live-Daten und ermöglichen eine Reaktion. Entdecke, wie die Teile zusammenarbeiten.`,"Current implementation · Protocol v3":`Aktuelle Implementierung · Protokoll v3`,"Runtime applications":`Laufzeitanwendungen`,"One bidirectional channel":`Ein bidirektionaler Kanal`,"Durable shared state":`Dauerhafter gemeinsamer Zustand`,"Role-based":`Rollenbasiert`,"Sessions + sensor token":`Sitzungen und Sensor-Token`,"System map":`Systemkarte`,"Select a component to explore its responsibilities":`Eine Komponente auswählen, um ihre Aufgaben zu erkunden`,"Swipe horizontally to explore the map. Tap a component for details.":`Zum Erkunden der Karte horizontal wischen. Eine Komponente für Details antippen.`,"Interactive architecture map: sensor connects to relay, relay connects to monitor, control room, and SQLite":`Interaktive Architekturkarte: Sensor mit Relay verbunden; Relay mit Live-Monitor, Leitstand und SQLite verbunden`,"Explore sensor service":`Sensordienst erkunden`,"Explore relay server":`Relay-Server erkunden`,"Explore monitor app":`Live-Monitor erkunden`,"Explore control room":`Leitstand erkunden`,"Explore SQLite storage":`SQLite-Speicher erkunden`,"Keyboard: Tab to a node, then Enter":`Tastatur: Mit Tab eine Komponente wählen, dann Enter`,"EDGE / NODE.JS":`SENSOR / NODE.JS`,"BACKEND / NODE.JS":`BACKEND / NODE.JS`,"BROWSER / REACT":`BROWSER / REACT`,"Read → detect → send":`Messen → erkennen → senden`,"Validate → store → route":`Prüfen → speichern → verteilen`,"Chart · log · settings":`Diagramm · Protokoll · Einstellungen`,"Review · acknowledge":`Prüfen · bestätigen`,"Alerts · settings · auth":`Alarme · Einstellungen · Anmeldung`,"Data / events":`Daten / Ereignisse`,"Commands / responses":`Befehle / Antworten`,"Acknowledgements reach all clients.":`Bestätigungen erreichen alle Clients.`,"Shared contract: packages/protocol":`Gemeinsamer Vertrag: packages/protocol`,"Three boundaries worth remembering":`Drei wichtige Zuständigkeitsgrenzen`,"01 / DETECTION":`01 / ERKENNUNG`,"02 / AUTHORITY":`02 / ZUSTÄNDIGKEIT`,"03 / PRESENTATION":`03 / DARSTELLUNG`,"The sensor makes the decision.":`Der Sensor trifft die Entscheidung.`,"The relay owns shared state.":`Der Relay verwaltet den gemeinsamen Zustand.`,"Browsers project that state.":`Browser zeigen diesen Zustand an.`,"Crossings are detected once, in a standalone service. Closing a browser does not stop monitoring. The current data source is simulated.":`Übergänge werden einmalig in einem eigenständigen Dienst erkannt. Das Schließen eines Browsers beendet die Überwachung nicht. Die aktuelle Datenquelle ist simuliert.`,"Alerts, acknowledgements, settings, users, and sessions live in SQLite. The relay checks identity and role before routing messages.":`Alarme, Bestätigungen, Einstellungen, Benutzer und Sitzungen liegen in SQLite. Der Relay prüft Identität und Rolle vor dem Verteilen von Nachrichten.`,"The monitor combines a fast reading buffer with Redux. The control room uses a reducer for its alarm list and acknowledgement actions.":`Der Live-Monitor kombiniert einen schnellen Messwertpuffer mit Redux. Der Leitstand nutzt einen Reducer für Alarmliste und Bestätigungsaktionen.`,"How to use this guide.":`So verwendest du diesen Leitfaden.`,"Start with the map, step through a message journey, then inspect the code that implements it. All examples describe the repository; animations illustrate behavior and are not live telemetry.":`Beginne mit der Karte, gehe einen Nachrichtenablauf schrittweise durch und untersuche den zugehörigen Code. Alle Beispiele beschreiben das Repository; die Darstellung veranschaulicht Verhalten und zeigt keine Live-Telemetrie.`,"Explore the live simulator":`Live-Simulator erkunden`,"Detection at the source":`Erkennung an der Quelle`,"The shared meeting point":`Die gemeinsame Vermittlungsstelle`,"Live signal & shared settings":`Live-Signal und gemeinsame Einstellungen`,"The operator workflow":`Der Ablauf für den Operator`,"Durable state, one relay":`Dauerhafter Zustand, ein Relay`,"A standalone Node process produces simulated temperatures and detects crossings. Its in-memory outbox retries retained alerts, while readings are sent without replay.":`Ein eigenständiger Node-Prozess erzeugt simulierte Temperaturen und erkennt Übergänge. Seine Outbox im Arbeitsspeicher wiederholt gespeicherte Alarme; Messwerte werden ohne Wiederholung gesendet.`,"Authenticates connections, validates message schemas and sender roles, persists alerts and settings, and routes updates. Detection stays in the sensor.":`Authentifiziert Verbindungen, prüft Nachrichtenschemas und Absenderrollen, speichert Alarme und Einstellungen und verteilt Aktualisierungen. Die Erkennung bleibt im Sensor.`,"A React dashboard with a rolling chart, alert log, and setting controls. Readings bypass Redux; alerts, settings, and sensor information use three slices.":`Ein React-Dashboard mit fortlaufendem Diagramm, Alarmprotokoll und Einstellungsfeldern. Messwerte umgehen Redux; Alarme, Einstellungen und Sensorinformationen verwenden drei Slices.`,"Shows alarms and lets authorized operators acknowledge them. One reducer merges incoming records, tracks pending acknowledgements, and caps the list at 500.":`Zeigt Alarme und erlaubt berechtigten Operatoren deren Bestätigung. Ein Reducer führt Datensätze zusammen, verfolgt offene Bestätigungen und begrenzt die Liste auf 500 Einträge.`,"Stores users, hashed session tokens, alerts, acknowledgements, and per-sensor settings. Temperature readings and the sensor outbox are not persisted here.":`Speichert Benutzer, gehashte Sitzungstoken, Alarme, Bestätigungen und Einstellungen je Sensor. Temperaturmesswerte und die Sensor-Outbox werden hier nicht dauerhaft gespeichert.`,"Illustrative model · offline":`Veranschaulichendes Modell · offline`,Step:`Schritt`,Restart:`Neustart`,Settings:`Einstellungen`,Inspect:`Untersuchen`,"Trace & payload":`Ablauf und Nutzdaten`,"Inspector section":`B

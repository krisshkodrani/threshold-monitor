# No setup: `docker compose up --build`. On its first start, the relay makes
# the sensor token in the data volume; the sensor reads it from there. To set
# your own token, put SENSOR_TOKEN (16 characters or more) in a .env file.
# The demo users are on by default, for a local demo. For anything else:
#   DEMO_USERS=false docker compose up --build
services:
  relay:
    build: .
    image: threshold-monitor
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: info
      # The relay accepts a sensor only with this token: SENSOR_TOKEN if it is
      # set, else the token in the file (made on the first start).
      SENSOR_TOKEN: ${SENSOR_TOKEN:-}
      SENSOR_TOKEN_FILE: /app/data/sensor-token
      # ALLOWED_ORIGINS: "https://monitor.example.com"
      # Set to "true" when a TLS proxy serves the app over https.
      # COOKIE_SECURE: "true"
      # Set to "true" when a reverse proxy is in front, so each user has their
      # own login limit.
      # TRUST_PROXY: "true"
      # "operator", "monitor" and "demo" (both roles), password "demo". On by
      # default here, for a local demo; the server's own default is off. The
      # users stay in the volume: after DEMO_USERS=false, remove the volume
      # (docker compose down -v) or the users.
      DEMO_USERS: ${DEMO_USERS:-true}
    restart: unless-stopped
    # The server writes only to the database volume; the rest is read-only.
    read_only: true
    volumes:
      - data:/app/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 10s

  # The sensor agent: makes the readings and the alerts, and sends them to the
  # relay. The same image; it writes nothing and opens no port.
  sensor:
    image: threshold-monitor
    command: ["node", "/app/sensor/dist/index.js"]
    environment:
      LOG_LEVEL: info
      RELAY_URL: ws://relay:8080/ws
      SENSOR_TOKEN: ${SENSOR_TOKEN:-}
      SENSOR_TOKEN_FILE: /app/data/sensor-token
      # SENSOR_LABEL: "Sensor 1"
      # SENSOR_RATE_HZ: "2" # 1, 2, 5 or 10 readings each second
    depends_on:
      relay:
        condition: service_healthy
    # The image's health check is for the relay's port, not for the sensor.
    healthcheck:
      disable: true
    restart: unless-stopped
    read_only: true
    # Only to read the token file; the sensor cannot change the database.
    volumes:
      - data:/app/data:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 5s

# Users, sessions and alerts. Add a user:
#   echo 'a-long-password' | docker compose exec -T relay \
#     node dist/cli.js user:add kris --name "Kris" --roles operator,monitor
volumes:
  data:
